# Optional dynamic deployment for the Moments archive.
# Run from the repository root with `pnpm docker:up:dynamic`.

services:
  astro-koharu:
    image: astro-koharu:dynamic
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dynamic
      args:
        KOHARU_SUITE_URL: "${KOHARU_SUITE_URL:?Set KOHARU_SUITE_URL in .env}"
    environment:
      KOHARU_SUITE_URL: "${KOHARU_SUITE_URL:?Set KOHARU_SUITE_URL in .env}"
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "${BLOG_PORT:-4321}:4321"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4321/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - astro-koharu-network

networks:
  astro-koharu-network:
    driver: bridge
